openapi: 3.0.3
info:
  title: Orbita API
  version: 1.0.0
  description: 'API REST de Orbita: gestión de proyectos y tareas en equipo.'
paths:
  /api/:
    get:
      operationId: root_retrieve
      description: 'Punto de entrada: desde aquí el cliente descubre todos los recursos.'
      summary: Raíz de la API (HATEOAS)
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Iniciar sesión
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Cerrar sesión
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Usuario de la sesión actual
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/registro/:
    post:
      operationId: auth_registro_create
      summary: Crear cuenta e iniciar sesión
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registro'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Registro'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/csrf/:
    get:
      operationId: csrf_retrieve
      description: |-
        El SPA llama a este endpoint al iniciar: get_token() fija la cookie 'csrftoken'.
        Luego envía ese valor en el header X-CSRFToken en cada POST/PUT/PATCH/DELETE.
        No se usa @csrf_exempt: la protección CSRF sigue activa.
      summary: Obtener token CSRF (SPA con autenticación por sesión)
      tags:
      - csrf
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/proyectos/:
    get:
      operationId: proyectos_list
      summary: Listar proyectos
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: propietario
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - proyectos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProyectoList'
          description: ''
    post:
      operationId: proyectos_create
      summary: Crear proyecto
      tags:
      - proyectos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Proyecto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Proyecto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Proyecto'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
          description: ''
  /api/proyectos/{id}/:
    get:
      operationId: proyectos_retrieve
      summary: Detalle de proyecto
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proyecto.
        required: true
      tags:
      - proyectos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
          description: ''
    put:
      operationId: proyectos_update
      summary: Reemplazar proyecto
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proyecto.
        required: true
      tags:
      - proyectos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Proyecto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Proyecto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Proyecto'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
          description: ''
    patch:
      operationId: proyectos_partial_update
      summary: Actualizar parcialmente un proyecto
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proyecto.
        required: true
      tags:
      - proyectos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProyecto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProyecto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProyecto'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
          description: ''
    delete:
      operationId: proyectos_destroy
      summary: Eliminar proyecto
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proyecto.
        required: true
      tags:
      - proyectos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/proyectos/{id}/estadisticas/:
    get:
      operationId: proyectos_estadisticas_retrieve
      summary: Estadísticas de tareas por estado del proyecto
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este proyecto.
        required: true
      tags:
      - proyectos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/tareas/:
    get:
      operationId: tareas_list
      summary: Listar tareas (paginado, filtrable, ordenable)
      parameters:
      - in: query
        name: creado_desde
        schema:
          type: string
          format: date
      - in: query
        name: creado_hasta
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: prioridad
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
        description: |-
          * `1` - Baja
          * `2` - Media
          * `3` - Alta
      - in: query
        name: prioridad_min
        schema:
          type: integer
      - in: query
        name: proyecto
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Busca en título, descripción y proyecto
      - in: query
        name: status
        schema:
          type: string
          enum:
          - activo
          - completado
          - pendiente
        description: |-
          * `pendiente` - Pendiente
          * `activo` - Activo
          * `completado` - Completado
      - in: query
        name: titulo
        schema:
          type: string
      - in: query
        name: vence_antes
        schema:
          type: string
          format: date
      tags:
      - tareas
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTareaList'
          description: ''
    post:
      operationId: tareas_create
      summary: Crear tarea
      tags:
      - tareas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tarea'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tarea'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tarea'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
          description: ''
  /api/tareas/{id}/:
    get:
      operationId: tareas_retrieve
      summary: Detalle de tarea
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tarea.
        required: true
      tags:
      - tareas
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
          description: ''
    put:
      operationId: tareas_update
      summary: Reemplazar tarea
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tarea.
        required: true
      tags:
      - tareas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tarea'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Tarea'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Tarea'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
          description: ''
    patch:
      operationId: tareas_partial_update
      summary: Actualizar parcialmente una tarea
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tarea.
        required: true
      tags:
      - tareas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTarea'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTarea'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTarea'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
          description: ''
    delete:
      operationId: tareas_destroy
      summary: Eliminar tarea
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tarea.
        required: true
      tags:
      - tareas
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/tareas/{id}/cambiar_estado/:
    post:
      operationId: tareas_cambiar_estado_create
      summary: Cambiar el estado de una tarea
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este tarea.
        required: true
      tags:
      - tareas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstado'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambiarEstado'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambiarEstado'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
          description: ''
  /api/tareas/mias/:
    get:
      operationId: tareas_mias_retrieve
      summary: Tareas creadas por el usuario autenticado
      tags:
      - tareas
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
          description: ''
  /api/usuarios/:
    get:
      operationId: usuarios_list
      description: Solo lectura (GET list / retrieve). No expone datos sensibles.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - usuarios
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioList'
          description: ''
  /api/usuarios/{id}/:
    get:
      operationId: usuarios_retrieve
      description: Solo lectura (GET list / retrieve). No expone datos sensibles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este usuario.
        required: true
      tags:
      - usuarios
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
components:
  schemas:
    CambiarEstado:
      type: object
      description: Entrada de la @action personalizada POST /api/tareas/{id}/cambiar_estado/.
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    PaginatedProyectoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Proyecto'
    PaginatedTareaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tarea'
    PaginatedUsuarioList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
    PatchedProyecto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
        propietario:
          type: string
          format: uri
          readOnly: true
        propietario_username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          readOnly: true
        total_tareas:
          type: integer
          readOnly: true
        tareas_url:
          type: string
          description: 'HATEOAS: enlace a las tareas de este proyecto (filtro por
            query param).'
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
    PatchedTarea:
      type: object
      description: |-
        Pipeline: request.data -> to_internal_value() -> validate_<campo>() -> validate() -> .save()
        HATEOAS: 'url', 'proyecto' y '_links' permiten navegar la API sin documentación externa.
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        titulo:
          type: string
          maxLength: 200
        descripcion:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        prioridad:
          allOf:
          - $ref: '#/components/schemas/PrioridadEnum'
          minimum: 0
          maximum: 9223372036854775807
        prioridad_display:
          type: string
          readOnly: true
        fecha_limite:
          type: string
          format: date
          nullable: true
        vencida:
          type: boolean
          readOnly: true
        proyecto:
          type: string
          format: uri
        proyecto_nombre:
          type: string
          readOnly: true
        creado_por:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
        _links:
          type: object
          additionalProperties: {}
          readOnly: true
          title: ' links'
    PrioridadEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - Baja
        * `2` - Media
        * `3` - Alta
    Proyecto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
        propietario:
          type: string
          format: uri
          readOnly: true
        propietario_username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          readOnly: true
        total_tareas:
          type: integer
          readOnly: true
        tareas_url:
          type: string
          description: 'HATEOAS: enlace a las tareas de este proyecto (filtro por
            query param).'
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - nombre
      - propietario
      - propietario_username
      - tareas_url
      - total_tareas
      - url
    Registro:
      type: object
      properties:
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    StatusEnum:
      enum:
      - pendiente
      - activo
      - completado
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `activo` - Activo
        * `completado` - Completado
    Tarea:
      type: object
      description: |-
        Pipeline: request.data -> to_internal_value() -> validate_<campo>() -> validate() -> .save()
        HATEOAS: 'url', 'proyecto' y '_links' permiten navegar la API sin documentación externa.
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        titulo:
          type: string
          maxLength: 200
        descripcion:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        prioridad:
          allOf:
          - $ref: '#/components/schemas/PrioridadEnum'
          minimum: 0
          maximum: 9223372036854775807
        prioridad_display:
          type: string
          readOnly: true
        fecha_limite:
          type: string
          format: date
          nullable: true
        vencida:
          type: boolean
          readOnly: true
        proyecto:
          type: string
          format: uri
        proyecto_nombre:
          type: string
          readOnly: true
        creado_por:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
        _links:
          type: object
          additionalProperties: {}
          readOnly: true
          title: ' links'
      required:
      - _links
      - creado_por
      - created
      - id
      - prioridad_display
      - proyecto
      - proyecto_nombre
      - titulo
      - updated
      - url
      - vencida
    Usuario:
      type: object
      description: 'Solo campos públicos: nunca password, is_staff, is_superuser ni
        email.'
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellidos
          maxLength: 150
      required:
      - id
      - url
      - username
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
